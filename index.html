<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nexyronix Solutions Private Limited | Software &amp; Digital Solutions</title>
    <meta
      name="description"
      content="Nexyronix Solutions Private Limited builds websites, applications, custom software, AI solutions and digital products while providing internship opportunities across multiple domains."
    />
    <meta name="theme-color" content="#05070A" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Nexyronix Solutions Private Limited" />

    <!--
      Canonical / social URLs.
      These use the intended production domain. If you deploy somewhere else
      first (a Railway preview URL, a staging host), update these four values
      and public/sitemap.xml, or the tags will point at a domain that isn't
      serving this build yet.
    -->
    <link rel="canonical" href="https://nexyronix.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexyronix Solutions Private Limited" />
    <meta property="og:title" content="Nexyronix Solutions Private Limited | Software &amp; Digital Solutions" />
    <meta
      property="og:description"
      content="Nexyronix Solutions Private Limited builds websites, applications, custom software, AI solutions and digital products while providing internship opportunities across multiple domains."
    />
    <meta property="og:url" content="https://nexyronix.com/" />
    <meta property="og:image" content="https://nexyronix.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexyronix Solutions Private Limited | Software &amp; Digital Solutions" />
    <meta
      name="twitter:description"
      content="Nexyronix Solutions Private Limited builds websites, applications, custom software, AI solutions and digital products while providing internship opportunities across multiple domains."
    />
    <meta name="twitter:image" content="https://nexyronix.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Fonts: only the weights actually used by the design are requested
      (400/500/600). The previously-loaded 700 weight was unused and has been
      dropped. `display=swap` avoids invisible text; preconnect shortens the
      handshake.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Organization structured data.
      Only verified information is included: legal name, description, site URL,
      and the real contact details on file. Still no founding date, employee
      count, ratings, reviews or social profiles — none of those have been
      provided. Add `sameAs` once official social accounts genuinely exist.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nexyronix Solutions Private Limited",
        "alternateName": "Nexyronix",
        "url": "https://nexyronix.com/",
        "logo": "https://nexyronix.com/favicon.svg",
        "description": "Nexyronix Solutions Private Limited builds websites, applications, custom software, AI solutions and digital products while providing internship opportunities across multiple domains.",
        "email": "info@nexyronix.com",
        "telephone": "+919482081830",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "80, 4th Floor, Mango Meadows Layout, North Main Gate, Bidarahalli",
          "postalCode": "560049",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+919482081830",
          "email": "info@nexyronix.com"
        }
      }
    </script>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
